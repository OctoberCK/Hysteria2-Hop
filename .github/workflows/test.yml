name: Linux compatibility

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        image: [debian:12, ubuntu:24.04]
    steps:
      - uses: actions/checkout@v4
      - name: Test distro Python and real nftables in an isolated container
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          docker run --rm --cap-add NET_ADMIN \
            -e DEBIAN_FRONTEND=noninteractive -e PYTHONDONTWRITEBYTECODE=1 \
            -v "$PWD:/src:ro" -w /src "$IMAGE" bash -euc '
              apt-get update
              apt-get install -y --no-install-recommends python3 nftables iproute2
              for script in bootstrap.sh install.sh; do bash -n "$script"; done
              python3 -m unittest discover -s tests -v
              python3 -c "import hy2hop; print(hy2hop.rules(dict(start=20000, end=30000, port=443), [\"ip\", \"ip6\"]), end=\"\")" > /tmp/hop.nft
              nft -c -f /tmp/hop.nft
              nft -f /tmp/hop.nft
              nft list table ip hcloudlab_hy2hop
              nft list table ip6 hcloudlab_hy2hop
              python3 -c "import hy2hop; hy2hop.delete_tables(); assert not hy2hop.owned_tables()"
            '
